<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Ads BI - Advanced Local Engine</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdfa', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' },
                        surface: { 100: '#ffffff', 800: '#18181b', 900: '#09090b' },
                        border: { light: '#e4e4e7', dark: '#27272a' }
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(20, 184, 166, 0.1)',
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)'
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .glass-panel { background: rgba(24, 24, 27, 0.65); backdrop-filter: blur(12px); border: 1px solid #27272a; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row overflow-hidden">

    <aside id="sidebar-container" class="w-full md:w-64 glass-panel border-r border-border-dark flex-shrink-0 flex flex-col"></aside>
    
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header id="topbar-container" class="h-16 glass-panel border-b border-border-dark flex items-center justify-between px-6 shrink-0"></header>
        <div id="workspace-container" class="flex-1 overflow-y-auto p-6 space-y-6 scrollbar-hide">
            <div id="drop-zone" class="w-full max-w-2xl mx-auto mt-20 p-12 border-2 border-dashed border-border-dark rounded-xl flex flex-col items-center justify-center text-center transition-colors hover:border-brand-500 hover:bg-brand-900/10 cursor-pointer">
                <i data-lucide="upload-cloud" class="w-12 h-12 text-brand-500 mb-4"></i>
                <h3 class="text-xl font-semibold mb-2">Carregar Dados (JSON, TXT, n8n logs)</h3>
                <p class="text-gray-400 text-sm mb-6">Processamento local de alta performance em ES2023.</p>
                <input type="file" id="file-upload" class="hidden" accept=".json,.txt,.csv" multiple>
                <button onclick="document.getElementById('file-upload').click()" class="bg-brand-600 hover:bg-brand-500 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                    Selecionar Arquivos
                </button>
            </div>
            
            <div id="dashboard-content" class="hidden flex-col gap-6"></div>
        </div>
    </main>

    <script>
        const Utils = {
            safeDiv: (num, den) => (den === 0 || isNaN(den) || !den) ? 0 : num / den,
            formatCurrency: (value, currency = 'BRL') => new Intl.NumberFormat('pt-BR', { style: 'currency', currency }).format(value || 0),
            formatNumber: (value) => new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 }).format(value || 0),
            formatPercent: (value) => new Intl.NumberFormat('pt-BR', { style: 'percent', maximumFractionDigits: 2 }).format(value || 0),
            debounce: (func, wait) => {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => { clearTimeout(timeout); func(...args); };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            },
            generateId: () => crypto.randomUUID()
        };

        const Config = {
            chartDefaults: {
                responsive: true,
                maintainAspectRatio: false,
                color: '#a1a1aa',
                font: { family: 'Inter', size: 12 },
                plugins: {
                    legend: { labels: { color: '#e4e4e7' } },
                    tooltip: { backgroundColor: 'rgba(24, 24, 27, 0.9)', titleColor: '#fff', bodyColor: '#cbd5e1', borderColor: '#27272a', borderWidth: 1 }
                },
                scales: {
                    x: { grid: { color: '#27272a', drawBorder: false }, ticks: { color: '#a1a1aa' } },
                    y: { grid: { color: '#27272a', drawBorder: false }, ticks: { color: '#a1a1aa' } }
                }
            }
        };

        Chart.defaults.color = Config.chartDefaults.color;
        Chart.defaults.font.family = Config.chartDefaults.font.family;

        class StateManager {
            constructor() {
                this.state = {
                    rawData: [], normalized: [], filtered: [],
                    metrics: { global: {} },
                    filters: { dateStart: null, dateEnd: null, search: '' },
                    settings: { businessType: 'unknown' }
                };
                this.listeners = new Set();
            }
            subscribe(listener) { this.listeners.add(listener); return () => this.listeners.delete(listener); }
            notify(changedKeys = []) { this.listeners.forEach(listener => listener(this.state, changedKeys)); }
            get(key) { return this.state[key]; }
            set(key, value) { this.state[key] = value; this.notify([key]); }
            update(updates) {
                const keys = Object.keys(updates);
                keys.forEach(key => this.state[key] = updates[key]);
                this.notify(keys);
            }
        }
        const AppState = new StateManager();
        lucide.createIcons();

        const Parser = {
            async processFiles(files) {
                const allData = [];
                for (const file of files) {
                    try {
                        const text = await this.readFile(file);
                        const parsed = this.parseText(text);
                        
                        if (Array.isArray(parsed)) allData.push(...parsed);
                        else if (typeof parsed === 'object' && parsed !== null) {
                            if (parsed.data && Array.isArray(parsed.data)) allData.push(...parsed.data);
                            else allData.push(parsed);
                        }
                    } catch (error) {
                        console.error(`[Parser] Falha no arquivo ${file.name}:`, error);
                    }
                }
                return allData;
            },

            readFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = (e) => reject(e);
                    reader.readAsText(file);
                });
            },

            parseText(text) {
                try {
                    return JSON.parse(text);
                } catch (e) {
                    if (text.includes('campaign_id:') && text.includes('reach:')) {
                        return this.parseN8nText(text);
                    }
                    return [];
                }
            },

            // Máquina de estados ATUALIZADA para blindar a leitura dos arrays do n8n
            parseN8nText(text) {
                const lines = text.split('\n').map(l => l.trim());
                const data = [];
                let currentRow = null;
                let currentArray = null;
                let currentArrayItem = null;

                // Dicionário exato de chaves raiz que exigem o encerramento de um array
                const rootKeys = [
                    'campaign_id', 'campaign_name', 'adset_id', 'adset_name', 'ad_id', 'ad_name', 
                    'spend', 'reach', 'impressions', 'clicks', 'inline_link_clicks', 
                    'date_start', 'date_stop', 'optimization_goal'
                ];
                
                const arrayKeys = ['actions', 'action_values', 'results', 'video_thruplay_watched_actions'];

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (!line) continue;

                    // Novo bloco detectado
                    if (line.startsWith('campaign_id:')) {
                        if (currentRow) {
                            if (currentArrayItem && currentArray && currentRow[currentArray]) currentRow[currentArray].push(currentArrayItem);
                            data.push(currentRow);
                        }
                        currentRow = { actions: [], action_values: [], video_thruplay_watched_actions: [] };
                        currentArray = null;
                        currentArrayItem = null;
                        currentRow['campaign_id'] = line.substring(line.indexOf(':')+1).trim();
                        continue;
                    }

                    if (!currentRow) continue;

                    // Abertura de Array (actions, action_values, etc)
                    if (arrayKeys.includes(line)) {
                        if (currentArrayItem && currentArray && currentRow[currentArray]) currentRow[currentArray].push(currentArrayItem);
                        currentArray = line;
                        if (!currentRow[currentArray]) currentRow[currentArray] = [];
                        currentArrayItem = null;
                        continue;
                    }

                    // Index do Array
                    if (/^\d+$/.test(line)) {
                        if (currentArray) {
                            if (currentArrayItem && Object.keys(currentArrayItem).length > 0) currentRow[currentArray].push(currentArrayItem);
                            currentArrayItem = {};
                        }
                        continue;
                    }

                    const colonIdx = line.indexOf(':');
                    if (colonIdx > -1) {
                        const key = line.substring(0, colonIdx).trim();
                        const val = line.substring(colonIdx + 1).trim();

                        // SE A CHAVE PERTENCE À RAIZ (ex: date_start), SAIA DO ARRAY
                        if (rootKeys.includes(key)) {
                            if (currentArrayItem && currentArray && currentRow[currentArray]) currentRow[currentArray].push(currentArrayItem);
                            currentArray = null;
                            currentArrayItem = null;
                            currentRow[key] = val;
                        } else {
                            if (currentArray && currentArrayItem) {
                                currentArrayItem[key] = val;
                            } else {
                                currentRow[key] = val;
                            }
                        }
                    }
                }

                if (currentRow) {
                    if (currentArrayItem && currentArray && currentRow[currentArray]) currentRow[currentArray].push(currentArrayItem);
                    data.push(currentRow);
                }
                return data;
            }
        };

        const Normalizer = {
            normalize(rawData) {
                return rawData.map(row => {
                    const parsedActions = this.parseDynamicArray(row.actions || []);
                    const parsedActionValues = this.parseDynamicArray(row.action_values || []);
                    const parsedThruplays = this.parseDynamicArray(row.video_thruplay_watched_actions || []);

                    return {
                        _id: Utils.generateId(),
                        campaign_id: row.campaign_id || 'unknown_campaign',
                        campaign_name: row.campaign_name || 'Campanha Desconhecida',
                        spend: parseFloat(row.spend || 0),
                        reach: parseInt(row.reach || 0),
                        impressions: parseInt(row.impressions || 0),
                        clicks: parseInt(row.clicks || 0),
                        inline_link_clicks: parseInt(row.inline_link_clicks || row.clicks || 0),
                        actions: parsedActions,
                        action_values: parsedActionValues,
                        thruplays: parsedThruplays.video_view || 0,
                        date_start: row.date_start || null
                    };
                });
            },

            parseDynamicArray(arr) {
                const map = {};
                if (!Array.isArray(arr)) return map;
                arr.forEach(item => {
                    if (item.action_type) {
                        const safeKey = item.action_type.replace(/\./g, '_');
                        map[safeKey] = parseFloat(item.value || 0);
                    }
                });
                return map;
            }
        };

        const BusinessDetector = {
            detect(normalizedData) {
                let metricsCount = { purchase: 0, lead: 0, message: 0 };
                normalizedData.forEach(row => {
                    const purchases = (row.actions.purchase || row.actions.offsite_conversion_purchase || row.actions.offsite_conversion_fb_pixel_purchase || 0);
                    const leads = (row.actions.lead || row.actions.onsite_conversion_lead_grouped || row.actions.offsite_conversion_fb_pixel_lead || 0);
                    const messages = (row.actions.messaging_conversation_started_7d || row.actions.onsite_conversion_messaging_conversation_started_7d || 0);
                    
                    metricsCount.purchase += purchases;
                    metricsCount.lead += leads;
                    metricsCount.message += messages;
                });

                if (metricsCount.purchase > metricsCount.lead && metricsCount.purchase > metricsCount.message) return 'ecommerce';
                if (metricsCount.lead > metricsCount.purchase && metricsCount.lead > metricsCount.message) return 'lead_generation';
                if (metricsCount.message > metricsCount.purchase && metricsCount.message > metricsCount.lead) return 'messaging';
                
                if (metricsCount.lead > 0 || metricsCount.message > 0) return 'lead_generation';
                return 'brand_awareness';
            }
        };

        // INPUT HOOK ATUALIZADO COM TRATATIVA DE ERRO VISUAL
        document.getElementById('file-upload').addEventListener('change', async (event) => {
            const files = event.target.files;
            if (files.length === 0) return;

            const dropZone = document.getElementById('drop-zone');
            dropZone.innerHTML = `<i data-lucide="loader-2" class="w-12 h-12 text-brand-500 mb-4 animate-spin"></i><h3 class="text-xl font-semibold">Processando arquivo(s)...</h3>`;
            lucide.createIcons();

            requestAnimationFrame(async () => {
                const rawData = await Parser.processFiles(files);
                
                // Trava de segurança para dados corrompidos
                if(rawData.length === 0) {
                    dropZone.innerHTML = `
                        <i data-lucide="x-circle" class="w-12 h-12 text-red-500 mb-4"></i>
                        <h3 class="text-xl font-semibold mb-2">Falha na Leitura</h3>
                        <p class="text-gray-400 text-sm mb-6">O arquivo TXT não possui a formatação correta dos logs do n8n.</p>
                        <button onclick="location.reload()" class="bg-surface-800 hover:bg-surface-700 text-white px-6 py-2 rounded-lg font-medium transition-colors border border-border-dark">Tentar Novamente</button>
                    `;
                    lucide.createIcons();
                    return;
                }

                const normalizedData = Normalizer.normalize(rawData);
                const businessType = BusinessDetector.detect(normalizedData);
                
                AppState.update({
                    rawData: rawData,
                    normalized: normalizedData,
                    filtered: normalizedData,
                    settings: { ...AppState.get('settings'), businessType }
                });
            });
        });

        const MetricsEngine = {
            calculate(data) {
                let m = {
                    spend: 0, impressions: 0, clicks: 0, reach: 0, inline_link_clicks: 0,
                    purchases: 0, revenue: 0, leads: 0, messages: 0, thruplays: 0
                };

                data.forEach(row => {
                    m.spend += row.spend;
                    m.impressions += row.impressions;
                    m.clicks += row.clicks;
                    m.reach += row.reach; 
                    m.inline_link_clicks += row.inline_link_clicks;
                    m.thruplays += row.thruplays;

                    m.purchases += (row.actions.purchase || row.actions.offsite_conversion_purchase || row.actions.offsite_conversion_fb_pixel_purchase || 0);
                    m.revenue += (row.action_values.purchase || row.action_values.offsite_conversion_purchase || row.action_values.offsite_conversion_fb_pixel_purchase || 0);
                    
                    m.leads += (row.actions.lead || row.actions.onsite_conversion_lead_grouped || row.actions.offsite_conversion_fb_pixel_lead || 0);
                    m.messages += (row.actions.onsite_conversion_messaging_conversation_started_7d || row.actions.messaging_conversation_started_7d || 0);
                });

                const cpm = Utils.safeDiv(m.spend, m.impressions) * 1000;
                const ctr = Utils.safeDiv(m.inline_link_clicks || m.clicks, m.impressions);
                const cpc = Utils.safeDiv(m.spend, m.inline_link_clicks || m.clicks);
                const roas = Utils.safeDiv(m.revenue, m.spend);
                const cpa = Utils.safeDiv(m.spend, m.purchases);
                const cpl = Utils.safeDiv(m.spend, m.leads);
                const cpmsg = Utils.safeDiv(m.spend, m.messages);

                return { ...m, cpm, ctr, cpc, roas, cpa, cpl, cpmsg };
            }
        };

        const KPIs = {
            render(metrics, businessType) {
                const container = document.getElementById('kpi-container');
                if (!container) return;

                let config = [
                    { label: 'Investimento Total', value: Utils.formatCurrency(metrics.spend), icon: 'dollar-sign', color: 'text-gray-200' },
                    { label: 'Alcance Acumulado', value: Utils.formatNumber(metrics.reach), icon: 'radio-tower', color: 'text-amber-400' },
                    { label: `Cliques Link (CTR: ${Utils.formatPercent(metrics.ctr)})`, value: Utils.formatNumber(metrics.inline_link_clicks), icon: 'mouse-pointer-2', color: 'text-blue-400' },
                    { label: 'ThruPlays', value: Utils.formatNumber(metrics.thruplays), icon: 'play', color: 'text-purple-400' }
                ];

                if (businessType === 'ecommerce') {
                    config.unshift(
                        { label: `Faturamento (ROAS: ${Utils.formatNumber(metrics.roas)}x)`, value: Utils.formatCurrency(metrics.revenue), icon: 'trending-up', color: 'text-brand-500' },
                        { label: `Compras (CPA: ${Utils.formatCurrency(metrics.cpa)})`, value: Utils.formatNumber(metrics.purchases), icon: 'shopping-cart', color: 'text-brand-500' }
                    );
                } else {
                    config.unshift(
                        { label: `Leads Form (CPL: ${Utils.formatCurrency(metrics.cpl)})`, value: Utils.formatNumber(metrics.leads), icon: 'users', color: 'text-brand-500' },
                        { label: `Conversas Msg (CPMsg: ${Utils.formatCurrency(metrics.cpmsg)})`, value: Utils.formatNumber(metrics.messages), icon: 'message-circle', color: 'text-brand-500' }
                    );
                }

                container.innerHTML = config.map(card => `
                    <div class="glass-panel p-6 rounded-xl flex flex-col justify-between shadow-card hover:border-brand-500/50 transition-all">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-sm font-medium text-gray-400">${card.label}</span>
                            <i data-lucide="${card.icon}" class="w-5 h-5 ${card.color}"></i>
                        </div>
                        <h4 class="text-3xl font-bold text-white tracking-tight">${card.value}</h4>
                    </div>
                `).join('');
                lucide.createIcons();
            }
        };

        const ChartsEngine = {
            instances: {},
            render(data, businessType) {
                this.ensureContainers();
                const timelineData = this.groupDataByDate(data);
                const campaignData = this.groupDataByCampaign(data);
                this.renderTimelineChart(timelineData, businessType);
                this.renderCompositionChart(campaignData);
            },
            ensureContainers() {
                const dashboardContent = document.getElementById('dashboard-content');
                if (!document.getElementById('charts-container')) {
                    dashboardContent.insertAdjacentHTML('beforeend', `
                        <div id="charts-container" class="grid grid-cols-1 lg:grid-cols-3 gap-6 w-full mt-2">
                            <div class="glass-panel p-6 rounded-xl shadow-card lg:col-span-2 h-96 flex flex-col">
                                <h3 class="text-sm font-medium text-gray-400 mb-4 uppercase tracking-wider">Evolução Diária de Desempenho</h3>
                                <div class="relative flex-1 w-full h-full"><canvas id="chart-timeline"></canvas></div>
                            </div>
                            <div class="glass-panel p-6 rounded-xl shadow-card lg:col-span-1 h-96 flex flex-col">
                                <h3 class="text-sm font-medium text-gray-400 mb-4 uppercase tracking-wider">Divisão de Gasto por Campanha</h3>
                                <div class="relative flex-1 w-full h-full"><canvas id="chart-composition"></canvas></div>
                            </div>
                        </div>
                    `);
                }
            },
            destroyChart(id) { if (this.instances[id]) this.instances[id].destroy(); },
            groupDataByDate(data) {
                const grouped = {};
                data.forEach(row => {
                    if (!row.date_start) return;
                    if (!grouped[row.date_start]) grouped[row.date_start] = { spend: 0, revenue: 0, leads: 0, messages: 0 };
                    grouped[row.date_start].spend += row.spend;
                    grouped[row.date_start].revenue += (row.action_values.purchase || row.action_values.offsite_conversion_purchase || row.action_values.offsite_conversion_fb_pixel_purchase || 0);
                    grouped[row.date_start].leads += (row.actions.lead || row.actions.onsite_conversion_lead_grouped || row.actions.offsite_conversion_fb_pixel_lead || 0);
                    grouped[row.date_start].messages += (row.actions.messaging_conversation_started_7d || row.actions.onsite_conversion_messaging_conversation_started_7d || 0);
                });
                return Object.entries(grouped).sort(([a], [b]) => new Date(a) - new Date(b)).reduce((obj, [k, v]) => { obj[k] = v; return obj; }, {});
            },
            groupDataByCampaign(data) {
                const grouped = {};
                data.forEach(row => {
                    const name = row.campaign_name || 'Desconhecida';
                    if (!grouped[name]) grouped[name] = 0;
                    grouped[name] += row.spend;
                });
                const sorted = Object.entries(grouped).sort((a, b) => b[1] - a[1]);
                const top5 = sorted.slice(0, 5);
                const others = sorted.slice(5).reduce((acc, curr) => acc + curr[1], 0);
                if (others > 0) top5.push(['Outras', others]);
                return top5;
            },
            renderTimelineChart(timelineData, businessType) {
                this.destroyChart('chart-timeline');
                const ctx = document.getElementById('chart-timeline').getContext('2d');
                const labels = Object.keys(timelineData);
                const spendData = labels.map(l => timelineData[l].spend);
                
                let secondaryData = [], secondaryLabel = '', secondaryColor = '';
                if (businessType === 'ecommerce') {
                    secondaryData = labels.map(l => timelineData[l].revenue);
                    secondaryLabel = 'Receita (R$)'; secondaryColor = 'rgba(20, 184, 166, 1)';
                } else {
                    secondaryData = labels.map(l => timelineData[l].leads + timelineData[l].messages);
                    secondaryLabel = 'Conversões (Leads + Msg)'; secondaryColor = 'rgba(56, 189, 248, 1)';
                }

                const gradientSpend = ctx.createLinearGradient(0, 0, 0, 400);
                gradientSpend.addColorStop(0, 'rgba(20, 184, 166, 0.2)');
                gradientSpend.addColorStop(1, 'rgba(20, 184, 166, 0)');

                this.instances['chart-timeline'] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            { type: 'bar', label: secondaryLabel, data: secondaryData, backgroundColor: secondaryColor, borderRadius: 4, yAxisID: 'y' },
                            { type: 'line', label: 'Investimento (R$)', data: spendData, borderColor: '#14b8a6', backgroundColor: gradientSpend, fill: true, tension: 0.4, borderWidth: 2, yAxisID: 'y1' }
                        ]
                    },
                    options: {
                        ...Config.chartDefaults,
                        interaction: { mode: 'index', intersect: false },
                        scales: { x: Config.chartDefaults.scales.x, y: { type: 'linear', position: 'right', grid: { drawOnChartArea: false } }, y1: { type: 'linear', position: 'left' } }
                    }
                });
            },
            renderCompositionChart(campaignData) {
                this.destroyChart('chart-composition');
                const ctx = document.getElementById('chart-composition').getContext('2d');
                this.instances['chart-composition'] = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: campaignData.map(i => i[0]),
                        datasets: [{ data: campaignData.map(i => i[1]), backgroundColor: ['#14b8a6', '#0ea5e9', '#8b5cf6', '#f59e0b', '#f43f5e', '#3f3f46'], borderWidth: 0, hoverOffset: 4 }]
                    },
                    options: { ...Config.chartDefaults, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { padding: 20, color: '#a1a1aa', usePointStyle: true } } } }
                });
            }
        };

        const TableEngine = {
            sortConfig: { key: 'spend', direction: 'desc' },
            currentData: [], currentBusinessType: 'unknown',
            render(data, businessType) {
                this.currentBusinessType = businessType;
                this.ensureContainer();
                this.currentData = this.aggregateByCampaign(data);
                this.drawTable();
            },
            ensureContainer() {
                if (!document.getElementById('table-container')) {
                    document.getElementById('dashboard-content').insertAdjacentHTML('beforeend', `
                        <div id="table-container" class="glass-panel rounded-xl shadow-card w-full flex flex-col mt-2 overflow-hidden border border-border-dark">
                            <div class="p-6 border-b border-border-dark"><h3 class="text-lg font-semibold text-white">Desempenho por Campanha</h3></div>
                            <div class="overflow-x-auto scrollbar-hide"><table class="w-full text-left border-collapse"><thead id="table-head" class="bg-surface-900/80 text-xs uppercase text-gray-400 border-b border-border-dark"></thead><tbody id="table-body" class="text-sm text-gray-300 divide-y divide-border-dark"></tbody></table></div>
                        </div>
                    `);
                }
            },
            aggregateByCampaign(data) {
                const map = new Map();
                data.forEach(row => {
                    const id = row.campaign_id;
                    if (!map.has(id)) map.set(id, { id: id, name: row.campaign_name, spend: 0, impressions: 0, clicks: 0, purchases: 0, revenue: 0, leads: 0, messages: 0 });
                    const c = map.get(id);
                    c.spend += row.spend; c.impressions += row.impressions; c.clicks += row.inline_link_clicks || row.clicks;
                    c.purchases += (row.actions.purchase || row.actions.offsite_conversion_purchase || row.actions.offsite_conversion_fb_pixel_purchase || 0);
                    c.revenue += (row.action_values.purchase || row.action_values.offsite_conversion_purchase || row.action_values.offsite_conversion_fb_pixel_purchase || 0);
                    c.leads += (row.actions.lead || row.actions.onsite_conversion_lead_grouped || row.actions.offsite_conversion_fb_pixel_lead || 0);
                    c.messages += (row.actions.messaging_conversation_started_7d || row.actions.onsite_conversion_messaging_conversation_started_7d || 0);
                });
                return Array.from(map.values()).map(c => {
                    c.cpc = Utils.safeDiv(c.spend, c.clicks); c.roas = Utils.safeDiv(c.revenue, c.spend); c.cpa = Utils.safeDiv(c.spend, c.purchases); c.cpl = Utils.safeDiv(c.spend, c.leads); return c;
                });
            },
            getColumns() {
                const cols = [{ key: 'name', label: 'Campanha', format: 'text' }, { key: 'spend', label: 'Investimento', format: 'currency' }, { key: 'cpc', label: 'CPC', format: 'currency' }];
                if (this.currentBusinessType === 'ecommerce') cols.push({ key: 'revenue', label: 'Receita', format: 'currency' }, { key: 'roas', label: 'ROAS', format: 'number', suffix: 'x' }, { key: 'purchases', label: 'Compras', format: 'number' }, { key: 'cpa', label: 'CPA', format: 'currency' });
                else cols.push({ key: 'leads', label: 'Leads', format: 'number' }, { key: 'cpl', label: 'CPL', format: 'currency' }, { key: 'messages', label: 'Msg', format: 'number' });
                return cols;
            },
            handleSort(key) {
                if (this.sortConfig.key === key) this.sortConfig.direction = this.sortConfig.direction === 'asc' ? 'desc' : 'asc';
                else { this.sortConfig.key = key; this.sortConfig.direction = 'desc'; }
                this.drawTable();
            },
            drawTable() {
                const columns = this.getColumns();
                const { key, direction } = this.sortConfig;
                const sortedData = [...this.currentData].sort((a, b) => {
                    let valA = a[key], valB = b[key];
                    if (typeof valA === 'string') valA = valA.toLowerCase(); if (typeof valB === 'string') valB = valB.toLowerCase();
                    if (valA < valB) return direction === 'asc' ? -1 : 1; if (valA > valB) return direction === 'asc' ? 1 : -1; return 0;
                });
                document.getElementById('table-head').innerHTML = `<tr>${columns.map(col => `<th class="px-6 py-4 font-semibold cursor-pointer hover:text-brand-500 whitespace-nowrap" onclick="TableEngine.handleSort('${col.key}')">${col.label}</th>`).join('')}</tr>`;
                document.getElementById('table-body').innerHTML = sortedData.map(row => `<tr class="hover:bg-surface-800/80">${columns.map(col => {
                    let value = row[col.key];
                    if (col.format === 'currency') value = Utils.formatCurrency(value); else if (col.format === 'number') value = Utils.formatNumber(value) + (col.suffix || '');
                    return `<td class="px-6 py-4 whitespace-nowrap ${col.key === 'name' ? 'text-white max-w-[300px] truncate' : 'text-gray-400'}">${value}</td>`;
                }).join('')}</tr>`).join('');
            }
        };

        const FiltersEngine = {
            init() {
                document.getElementById('sidebar-container').innerHTML = `
                    <div class="p-6 border-b border-border-dark flex items-center gap-3 shrink-0 bg-surface-900/50">
                        <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center"><i data-lucide="bar-chart-3" class="text-white w-5 h-5"></i></div>
                        <h1 class="text-xl font-bold text-white tracking-tight">MetaAds<span class="text-brand-500 font-light">BI</span></h1>
                    </div>
                    <div class="p-6 flex flex-col gap-8 flex-1 overflow-y-auto">
                        <div><label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Pesquisar</label><input type="text" id="filter-search" placeholder="Campanha..." class="w-full bg-surface-800 border border-border-dark rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-brand-500" disabled></div>
                        <div class="space-y-4">
                            <div><span class="text-xs text-gray-500 block mb-1">Data Inicial</span><input type="date" id="filter-date-start" class="w-full bg-surface-800 border border-border-dark rounded-lg px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-brand-500 [color-scheme:dark]" disabled></div>
                            <div><span class="text-xs text-gray-500 block mb-1">Data Final</span><input type="date" id="filter-date-end" class="w-full bg-surface-800 border border-border-dark rounded-lg px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-brand-500 [color-scheme:dark]" disabled></div>
                        </div>
                    </div>
                `;
                lucide.createIcons();
                const apply = () => AppState.update({ filters: { search: document.getElementById('filter-search').value.toLowerCase(), dateStart: document.getElementById('filter-date-start').value, dateEnd: document.getElementById('filter-date-end').value } });
                document.getElementById('filter-search').addEventListener('input', Utils.debounce(apply, 300));
                document.getElementById('filter-date-start').addEventListener('change', apply);
                document.getElementById('filter-date-end').addEventListener('change', apply);
            },
            enable() { ['filter-search', 'filter-date-start', 'filter-date-end'].forEach(id => document.getElementById(id).removeAttribute('disabled')); },
            applyFilters(data, f) {
                if (!f.search && !f.dateStart && !f.dateEnd) return data;
                return data.filter(row => {
                    if (f.search && !(row.campaign_name || '').toLowerCase().includes(f.search)) return false;
                    if (f.dateStart && row.date_start && row.date_start < f.dateStart) return false;
                    if (f.dateEnd && row.date_start && row.date_start > f.dateEnd) return false;
                    return true;
                });
            }
        };

        const TopbarEngine = {
            render(count) {
                document.getElementById('topbar-container').innerHTML = `<div class="flex items-center gap-2"><i data-lucide="layout-dashboard" class="w-5 h-5 text-gray-400"></i><h2 class="text-sm font-medium text-gray-300">Workspace / <span class="text-white font-semibold">${count} registros carregados</span></h2></div>`;
                lucide.createIcons();
            }
        };

        FiltersEngine.init();

        AppState.subscribe((state, changedKeys) => {
            if (changedKeys.includes('normalized') || changedKeys.includes('filters')) {
                state.filtered = FiltersEngine.applyFilters(state.normalized, state.filters);
                if (state.normalized.length > 0) FiltersEngine.enable();
            }

            if (changedKeys.includes('filtered') || changedKeys.includes('normalized') || changedKeys.includes('filters')) {
                const dataToProcess = state.filtered;
                if (dataToProcess.length === 0) return;

                const globalMetrics = MetricsEngine.calculate(dataToProcess);
                state.metrics.global = globalMetrics;

                document.getElementById('drop-zone').classList.add('hidden');
                const content = document.getElementById('dashboard-content');
                content.classList.remove('hidden'); content.classList.add('flex');

                if (!document.getElementById('kpi-container')) content.insertAdjacentHTML('afterbegin', '<div id="kpi-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-6 w-full"></div>');

                TopbarEngine.render(dataToProcess.length);
                KPIs.render(globalMetrics, state.settings.businessType);

                requestAnimationFrame(() => {
                    ChartsEngine.render(dataToProcess, state.settings.businessType);
                    TableEngine.render(dataToProcess, state.settings.businessType);
                });
            }
        });
    </script>
</body>
</html>
